<style>

:root {

}

body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 48px;

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }

@media (min-width: 821px) { .side { position: sticky; top: 16px; } } /* 좁은 화면에서 고정하면 사진 목록 위에 겹침 */

input[type=text], input[type=date], input[type=number] {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);

input[type=date] { -webkit-appearance: none; appearance: none; text-align: left; } /* iOS 날짜칸이 칸 밖으로 넘치는 문제 */
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  color: var(--fg); padding: 8px 14px; min-height: 44px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }

.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; color: var(--muted); }
.drop.over { border-color: var(--accent); color: var(--fg); }
.drop .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }

.list { display: grid; gap: 10px; margin-top: 14px; }

  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.item img { width: 110px; height: 82px; object-fit: cover; border-radius: 4px; background: var(--line); }
.num { white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }

@media (max-width: 640px) {

  .item img { width: 80px; height: 64px; }

}
.touch .desk-only { display: none; }
/* 배포 버전 표시: 새로고침 후 최신인지 확인용 */
.ver { position: fixed; z-index: 5; pointer-events: none; font-size: 11px; color: var(--muted); opacity: .55;
  right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px));
  font-variant-numeric: tabular-nums; }
label.check { display: flex; gap: 8px; align-items: flex-start; color: var(--fg); }

<script src="template.js?v=2026.10.26_17:10"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
let photos = []; // { id, file, name, url, date, location, work }
let nextId = 1;

// ---- 파일명/메타데이터에서 날짜 ----
function dateFromName(name) {
  const m = name.match(/(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/);
  if (!m) return null;
  const [, y, mo, d] = m;
  if (+mo < 1 || +mo > 12 || +d < 1 || +d > 31) return null;
  return `${y}-${mo}-${d}`;
}
function dateFromModified(file) {
  const t = new Date(file.lastModified);
  const p = (n) => String(n).padStart(2, '0');
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
}

// JPEG EXIF의 촬영일(DateTimeOriginal, 없으면 DateTime). 아이폰 사진처럼 파일명에 날짜가 없을 때 사용
async function dateFromExif(file) {
  try {
    const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o + 4 < v.byteLength) {
      const marker = v.getUint16(o), len = v.getUint16(o + 2);
      if (marker === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) { // "Exif"
        const t = o + 10, le = v.getUint16(t) === 0x4949;
        const u16 = (x) => v.getUint16(t + x, le), u32 = (x) => v.getUint32(t + x, le);
        const found = {};
        const scan = (ifd) => {
          const n = u16(ifd);
          for (let i = 0; i < n; i++) {
            const e = ifd + 2 + i * 12, tag = u16(e);
            if (tag === 0x8769) scan(u32(e + 8));
            if (tag === 0x9003 || tag === 0x0132) {
              const off = u32(e + 8);
              found[tag] = String.fromCharCode(...new Uint8Array(v.buffer, t + off, 19));
            }
          }
        };
        scan(u32(4));
        const s = found[0x9003] || found[0x0132];
        const m = s && s.match(/^(\d{4}):(\d{2}):(\d{2})/);
        return m && m[1] !== '0000' ? `${m[1]}-${m[2]}-${m[3]}` : null;
      }
      if ((marker & 0xFF00) !== 0xFF00) break;
      o += 2 + len;
    }
  } catch (e) { /* EXIF가 없거나 깨진 경우 */ }
  return null;
}

async function addFiles(files) {
  const imgs = [...files].filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name));
  for (const f of imgs) {
    if (photos.some((p) => p.name === f.name && p.file.size === f.size)) continue; // 중복
    const date = dateFromName(f.name) || await dateFromExif(f) || dateFromModified(f);
    photos.push({ id: nextId++, file: f, name: f.name, url: URL.createObjectURL(f),
      date, location: '', work: '' });
  }
  // 파일명에 날짜+시간이 들어 있으므로 이름순 = 찍은(받은) 순서
  photos.sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name, 'en', { numeric: true }));
  render();
}

function numberOf(i) {
  return $('prefix').value + (Number($('start').value || 1) + i);
}

function render() {
  const list = $('list');
  list.textContent = '';
  let lastDate = null;
  photos.forEach((p, i) => {
    if (p.date !== lastDate) {
      const n = photos.filter((q) => q.date === p.date).length;
      const h = document.createElement('div');
      h.className = 'day';
      h.textContent = `${p.date} · ${n}장`;
      list.append(h);
      lastDate = p.date;
    }
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="num"></div>
      <img alt="" loading="lazy" decoding="async">
      <div class="fields">
        <input type="date" aria-label="일자" data-k="date">
        <input type="text" aria-label="위치" data-k="location">
        <input type="text" aria-label="작업내용" data-k="work">
        <div class="fname"></div>
      </div>
      <div class="ops">
        <button data-op="up" aria-label="위로">▲</button>
        <button data-op="down" aria-label="아래로">▼</button>
        <button data-op="del" aria-label="빼기">✕</button>
      </div>`;
    el.querySelector('.num').textContent = numberOf(i);
    el.querySelector('img').src = p.url;
    el.querySelector('.fname').textContent = p.name;
    for (const inp of el.querySelectorAll('input')) {
      const k = inp.dataset.k;
      inp.value = p[k];
      if (k === 'location') inp.placeholder = $('location').value;
      if (k === 'work') inp.placeholder = $('work').value;
      inp.addEventListener('change', () => { p[k] = inp.value; if (k === 'date') render(); });
    }
    el.querySelector('.ops').addEventListener('click', (e) => {
      const op = e.target.closest('button')?.dataset.op;
      if (!op) return;
      const idx = photos.indexOf(p);
      if (op === 'del') { URL.revokeObjectURL(p.url); photos.splice(idx, 1); }
      if (op === 'up' && idx > 0) [photos[idx - 1], photos[idx]] = [photos[idx], photos[idx - 1]];
      if (op === 'down' && idx < photos.length - 1) [photos[idx + 1], photos[idx]] = [photos[idx], photos[idx + 1]];
      render();
    });
    list.append(el);
  });
  $('make').disabled = photos.length === 0;
  setStatus(photos.length ? `사진 ${photos.length}장 · 엑셀 ${Math.ceil(photos.length / 2)}페이지` : '사진을 넣어 주세요.');
}

function setStatus(msg, warn = false) {
  $('status').textContent = msg;
  $('status').classList.toggle('warn', warn);
}

// ---- 사진 축소 (원본 그대로 넣으면 파일이 GB 단위로 커짐) ----
const MAX_SIDE = 1400;
// ratio(가로/세로)를 주면 가운데를 기준으로 그 비율로 잘라낸다
async function shrink(file, ratio) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  let sx = 0, sy = 0, sw = bmp.width, sh = bmp.height;
  if (ratio) {
    if (sw / sh > ratio) { sw = Math.round(sh * ratio); sx = Math.round((bmp.width - sw) / 2); }
    else { sh = Math.round(sw / ratio); sy = Math.round((bmp.height - sh) / 2); }
  }
  const scale = Math.min(1, MAX_SIDE / Math.max(sw, sh));
  const w = Math.round(sw * scale), h = Math.round(sh * scale);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(bmp, sx, sy, sw, sh, 0, 0, w, h);
  bmp.close();
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
  return { buffer: await blob.arrayBuffer(), w, h };
}

// ---- 엑셀 만들기: 매형분 양식(TEMPLATE) 1~30행(A4 한 장, 사진 2장)을 페이지마다 복제 ----
// 양식 구조: 1~2행 '사진대지', 4행 공사명, 5~17행 첫 사진, 18~30행 두 번째 사진
const PAGE_ROWS = 30, FIRST = 5;
// 열 너비(px, 기본글꼴 맑은 고딕 11 기준): A | B~F | G | H — 사진 비율 유지(잘라내기) 계산에만 사용
const COL_PX = [111, 90, 90, 90, 90, 90, 46, 111];
const ROW_PX = 35;                                  // 26.25pt
const EMU_PX = 9525;
// 사진 칸: 첫 사진 B6:G14, 두 번째 사진 B19:G27 (번호 줄 바로 아래부터 9행). 사진을 이 칸에 꽉 채운다
const BOX = { col0: 1, col1: 7, row0: 1, rows: 9 };
const BOX_W = COL_PX.slice(BOX.col0, BOX.col1).reduce((a, b) => a + b, 0);
const BOX_H = BOX.rows * ROW_PX;

const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const strCell = (ref, s, text) => `<c r="${ref}" s="${s}" t="inlineStr"><is><t>${esc(text)}</t></is></c>`;
function dateCell(ref, iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const serial = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000);
  return `<c r="${ref}" s="21"><v>${serial}</v></c>`;
}

// 사진의 왼쪽 위를 B열·번호 아래 줄 모서리에, 오른쪽 아래를 H열·11번째 행 모서리에 고정
const cellAt = (col, row) => `<xdr:col>${col}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${row}</xdr:row><xdr:rowOff>0</xdr:rowOff>`;
function picXml(n, rowBase) {
  return `<xdr:twoCellAnchor editAs="oneCell"><xdr:from>${cellAt(BOX.col0, rowBase + BOX.row0)}</xdr:from>` +
    `<xdr:to>${cellAt(BOX.col1, rowBase + BOX.row0 + BOX.rows)}</xdr:to>` +
    `<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${n + 1}" name="사진 ${n}"/><xdr:cNvPicPr/></xdr:nvPicPr>` +
    `<xdr:blipFill><a:blip r:embed="rId${n}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>` +
    `<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${BOX_W * EMU_PX}" cy="${BOX_H * EMU_PX}"/></a:xfrm>` +
    `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:twoCellAnchor>`;
}

async function buildWorkbook() {
  const T = TEMPLATE;
  const zip = new JSZip();
  const project = $('project').value.trim();
  const defLoc = $('location').value.trim(), defWork = $('work').value.trim();
  const fill = $('fill').checked;
  const pages = Math.ceil(photos.length / 2);
  const last = pages * PAGE_ROWS;

  let body = '', pics = '', drawRels = '';
  const merges = [];
  for (let pg = 0; pg < pages; pg++) {
    const off = pg * PAGE_ROWS;
    const shift = (n) => Number(n) + off;
    let xml = T.block
      .replace(/<row r="(\d+)"/g, (_, n) => `<row r="${shift(n)}"`)
      .replace(/ r="([A-H])(\d+)"/g, (_, c, n) => ` r="${c}${shift(n)}"`)
      .replace('%%A4%%', strCell(`A${shift(4)}`, 5, `◆ 공사명 : ${project}`));
    for (const slot of [0, 1]) {
      const i = pg * 2 + slot, p = photos[i];
      const base = slot * 13; // 두 번째 사진 블록은 13행 아래
      const at = (col, row) => `${col}${row + base + off}`;
      const fillCell = (key, cell) => { xml = xml.replace(`%%${key}%%`, cell); };
      const [kN, kL, kD, kW] = slot === 0 ? ['H5', 'B16', 'F16', 'B17'] : ['H18', 'B29', 'F29', 'B30'];
      if (!p) { // 홀수 장이면 마지막 칸은 빈 양식
        fillCell(kN, `<c r="${at('H', 5)}" s="9"/>`); fillCell(kL, `<c r="${at('B', 16)}" s="18"/>`);
        fillCell(kD, `<c r="${at('F', 16)}" s="21"/>`); fillCell(kW, `<c r="${at('B', 17)}" s="24"/>`);
        continue;
      }
      setStatus(`사진 처리 중… ${i + 1} / ${photos.length}`);
      fillCell(kN, strCell(at('H', 5), 9, numberOf(i)));
      fillCell(kL, strCell(at('B', 16), 18, p.location || defLoc));
      fillCell(kD, dateCell(at('F', 16), p.date));
      fillCell(kW, strCell(at('B', 17), 24, p.work || defWork));
      const img = await shrink(p.file, fill ? BOX_W / BOX_H : null);
      zip.file(`xl/media/image${i + 1}.jpeg`, img.buffer);
      pics += picXml(i + 1, FIRST - 1 + off + base);
      drawRels += `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image${i + 1}.jpeg"/>`;
    }
    body += xml;
    for (const m of ['A1:H2', 'A4:H4', 'B6:G14', 'B16:D16', 'F16:H16', 'B17:H17', 'B19:G27', 'B29:D29', 'F29:H29', 'B30:H30'])
      merges.push(m.replace(/\d+/g, (n) => shift(n)));
  }
  const breaks = pages > 1
    ? `<rowBreaks count="${pages - 1}" manualBreakCount="${pages - 1}">` +
      Array.from({ length: pages - 1 }, (_, k) => `<brk id="${(k + 1) * PAGE_ROWS}" max="16383" man="1"/>`).join('') + '</rowBreaks>'
    : '';
  const sheet = T.sheetHead.replace('%%LAST%%', last) + body +
    T.sheetTail.replace('%%MERGES%%', `<mergeCells count="${merges.length}">${merges.map((m) => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>`)
      .replace('%%BREAKS%%', breaks);

  zip.file('[Content_Types].xml', T.contentTypes);
  zip.file('_rels/.rels', T.rels);
  zip.file('xl/workbook.xml', T.workbook.replace('%%LAST%%', last));
  zip.file('xl/_rels/workbook.xml.rels', T.workbookRels);
  zip.file('xl/styles.xml', T.styles);
  zip.file('xl/theme/theme1.xml', T.theme);
  zip.file('xl/sharedStrings.xml', T.sharedStrings);
  zip.file('xl/worksheets/sheet1.xml', sheet);
  zip.file('xl/worksheets/_rels/sheet1.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/></Relationships>');
  zip.file('xl/drawings/drawing1.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' + pics + '</xdr:wsDr>');
  zip.file('xl/drawings/_rels/drawing1.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + drawRels + '</Relationships>');
  setStatus('엑셀 저장 중…');
  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

async function make() {
  $('make').disabled = true;
  try {
    const blob = await buildWorkbook();
    const filename = `사진대지_${numberOf(0)}~${numberOf(photos.length - 1)}.xlsx`;
    const size = `${(blob.size / 1048576).toFixed(1)}MB`;
    const downloads = window.claude?.use ? await window.claude.use('downloads') : null;
    if (downloads) {
      setStatus('저장 확인창에서 저장을 눌러 주세요.');
      try {
        await downloads.save({ filename, data: blob });
        setStatus(`완료: ${filename} (${size})`);
      } catch (e) {
        if (e?.code === 'declined') setStatus('저장을 취소했습니다. 다시 받으려면 엑셀 만들기를 누르세요.');
        else if (e?.code === 'rate_limited') setStatus('이미 저장 확인창이 열려 있습니다. 잠시 후 다시 눌러 주세요.', true);
        else setStatus(`이 화면에서는 저장할 수 없습니다 (${e?.code || e}).`, true);
      }
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      setStatus(`완료: ${filename} (${size})`);
    }
  } catch (e) {
    console.error(e);
    setStatus(`만들지 못했습니다: ${e.message}. 해당 사진을 빼고 다시 시도해 주세요.`, true);
  } finally {
    $('make').disabled = photos.length === 0;
  }
}

// ---- 입력 연결 ----
if (matchMedia('(pointer: coarse)').matches) document.documentElement.classList.add('touch');
$('pickFiles').onclick = () => $('fileInput').click();
$('pickDir').onclick = () => $('dirInput').click();
$('fileInput').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
$('dirInput').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
$('clear').onclick = () => { photos.forEach((p) => URL.revokeObjectURL(p.url)); photos = []; render(); };
$('make').onclick = make;
// 입력한 기본정보는 이 기기에 기억해 둔다
const SAVED = ['project', 'location', 'work', 'prefix', 'start'];
for (const id of SAVED) {
  try { const v = localStorage.getItem('ledger.' + id); if (v !== null) $(id).value = v; } catch (e) { /* 저장소 사용 불가 */ }
  $(id).addEventListener('input', () => {
    try { localStorage.setItem('ledger.' + id, $(id).value); } catch (e) { /* 저장소 사용 불가 */ }
    if (id !== 'project') render();
  });
}

async function filesFromEntry(entry) {
  if (entry.isFile) return [await new Promise((res, rej) => entry.file(res, rej))];
  const reader = entry.createReader(), out = [];
  for (;;) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    if (!batch.length) break;
    for (const e of batch) out.push(...await filesFromEntry(e));
  }
  return out;
}
const drop = $('drop');
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', async (e) => {
  e.preventDefault(); drop.classList.remove('over');
  const entries = [...e.dataTransfer.items].map((it) => it.webkitGetAsEntry?.()).filter(Boolean);
  if (entries.length) { const files = []; for (const en of entries) files.push(...await filesFromEntry(en)); addFiles(files); }
  else addFiles(e.dataTransfer.files);
});
