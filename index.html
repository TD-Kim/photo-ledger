<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>사진대지 만들기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 왼쪽 기본정보 패널 + 오른쪽 사진 목록, 좁으면 위아래로 */
:root {
  --bg: #f3f4f1; --panel: #ffffff; --fg: #1d2420; --muted: #5d6862;
  --line: #d3d8d3; --accent: #1f6f4a; --accent-fg: #ffffff; --warn: #9a5b00;
  --font: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #161a18; --panel: #212724; --fg: #e8ece9; --muted: #9aa59f;
    --line: #38403b; --accent: #4fb684; --accent-fg: #0d1a13; --warn: #e0a64a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #161a18; --panel: #212724; --fg: #e8ece9; --muted: #9aa59f;
  --line: #38403b; --accent: #4fb684; --accent-fg: #0d1a13; --warn: #e0a64a; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px;
  grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.side { display: grid; gap: 14px; }
@media (min-width: 821px) { .side { position: sticky; top: 16px; } } /* 좁은 화면에서 고정하면 사진 목록 위에 겹침 */
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=date], input[type=number] {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; width: 100%; max-width: 100%; min-width: 0; min-height: 40px; }
input[type=date] { -webkit-appearance: none; appearance: none; text-align: left; } /* iOS 날짜칸이 칸 밖으로 넘치는 문제 */
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  color: var(--fg); padding: 8px 14px; min-height: 44px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
button:disabled { opacity: .5; cursor: default; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; color: var(--muted); }
.drop.over { border-color: var(--accent); color: var(--fg); }
.drop .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.status { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.status.warn { color: var(--warn); }
.list { display: grid; gap: 10px; margin-top: 14px; }
.item { display: grid; grid-template-columns: 30px 110px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.item img { width: 110px; height: 82px; object-fit: cover; border-radius: 4px; background: var(--line); }
.num { white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.fields { display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px; min-width: 0; }
.fields input { min-height: 36px; padding: 6px 8px; font-size: 14px; }
.fname { grid-column: 1 / -1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ops { display: flex; gap: 4px; }
.ops button { min-height: 44px; min-width: 44px; padding: 0; }
.day { font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 6px; }
@media (max-width: 640px) {
  .item { grid-template-columns: 36px 80px minmax(0, 1fr); }
  .item img { width: 80px; height: 64px; }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .ops { grid-column: 1 / -1; justify-content: flex-end; }
}
.touch .desk-only { display: none; }
</style>
<div class="wrap">
  <aside class="side">
    <div>
      <h1>사진대지 만들기</h1>
      <p class="sub">카톡 사진을 넣으면 사진대지 엑셀을 만들어 줍니다. 사진은 이 기기 밖으로 나가지 않습니다.</p>
    </div>
    <div class="panel" style="display:grid;gap:12px">
      <label>공사명<input type="text" id="project" value="" placeholder="예: ○○~○○ 복선전철 ○공구 노반신설 기타공사"></label>
      <label>위치 (기본값)<input type="text" id="location" value="현장 내"></label>
      <label>작업내용 (기본값)<input type="text" id="work" value="안전시설물 설치 해체 인건비"></label>
      <div class="row2">
        <label>번호 앞부분<input type="text" id="prefix" value="2-"></label>
        <label>시작 번호<input type="number" id="start" value="1" min="1"></label>
      </div>
    </div>
    <button class="primary" id="make" disabled>엑셀 만들기</button>
    <div class="status" id="status">사진을 넣어 주세요.</div>
  </aside>

  <main>
    <div class="drop" id="drop">
      <span class="desk-only">사진 파일이나 날짜별 폴더를 여기로 끌어다 놓으세요.<br></span>
      파일명(KakaoTalk_20260803_…)이나 사진 정보에서 날짜를 읽고, 순서대로 번호를 붙입니다.
      <div class="btns">
        <button id="pickFiles">사진 선택</button>
        <button id="pickDir" class="desk-only">폴더 선택</button>
        <button id="clear">모두 지우기</button>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <input type="file" id="dirInput" webkitdirectory multiple hidden>
    </div>
    <div class="list" id="list"></div>
  </main>
</div>

<script src="exceljs.min.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
let photos = []; // { id, file, name, url, date, location, work }
let nextId = 1;

// ---- 파일명/메타데이터에서 날짜 ----
function dateFromName(name) {
  const m = name.match(/(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/);
  if (!m) return null;
  const [, y, mo, d] = m;
  if (+mo < 1 || +mo > 12 || +d < 1 || +d > 31) return null;
  return `${y}-${mo}-${d}`;
}
function dateFromModified(file) {
  const t = new Date(file.lastModified);
  const p = (n) => String(n).padStart(2, '0');
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
}

// JPEG EXIF의 촬영일(DateTimeOriginal, 없으면 DateTime). 아이폰 사진처럼 파일명에 날짜가 없을 때 사용
async function dateFromExif(file) {
  try {
    const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o + 4 < v.byteLength) {
      const marker = v.getUint16(o), len = v.getUint16(o + 2);
      if (marker === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) { // "Exif"
        const t = o + 10, le = v.getUint16(t) === 0x4949;
        const u16 = (x) => v.getUint16(t + x, le), u32 = (x) => v.getUint32(t + x, le);
        const found = {};
        const scan = (ifd) => {
          const n = u16(ifd);
          for (let i = 0; i < n; i++) {
            const e = ifd + 2 + i * 12, tag = u16(e);
            if (tag === 0x8769) scan(u32(e + 8));
            if (tag === 0x9003 || tag === 0x0132) {
              const off = u32(e + 8);
              found[tag] = String.fromCharCode(...new Uint8Array(v.buffer, t + off, 19));
            }
          }
        };
        scan(u32(4));
        const s = found[0x9003] || found[0x0132];
        const m = s && s.match(/^(\d{4}):(\d{2}):(\d{2})/);
        return m && m[1] !== '0000' ? `${m[1]}-${m[2]}-${m[3]}` : null;
      }
      if ((marker & 0xFF00) !== 0xFF00) break;
      o += 2 + len;
    }
  } catch (e) { /* EXIF가 없거나 깨진 경우 */ }
  return null;
}

async function addFiles(files) {
  const imgs = [...files].filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name));
  for (const f of imgs) {
    if (photos.some((p) => p.name === f.name && p.file.size === f.size)) continue; // 중복
    const date = dateFromName(f.name) || await dateFromExif(f) || dateFromModified(f);
    photos.push({ id: nextId++, file: f, name: f.name, url: URL.createObjectURL(f),
      date, location: '', work: '' });
  }
  // 파일명에 날짜+시간이 들어 있으므로 이름순 = 찍은(받은) 순서
  photos.sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name, 'en', { numeric: true }));
  render();
}

function numberOf(i) {
  return $('prefix').value + (Number($('start').value || 1) + i);
}

function render() {
  const list = $('list');
  list.textContent = '';
  let lastDate = null;
  photos.forEach((p, i) => {
    if (p.date !== lastDate) {
      const n = photos.filter((q) => q.date === p.date).length;
      const h = document.createElement('div');
      h.className = 'day';
      h.textContent = `${p.date} · ${n}장`;
      list.append(h);
      lastDate = p.date;
    }
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="num"></div>
      <img alt="" loading="lazy" decoding="async">
      <div class="fields">
        <input type="date" aria-label="일자" data-k="date">
        <input type="text" aria-label="위치" data-k="location">
        <input type="text" aria-label="작업내용" data-k="work">
        <div class="fname"></div>
      </div>
      <div class="ops">
        <button data-op="up" aria-label="위로">▲</button>
        <button data-op="down" aria-label="아래로">▼</button>
        <button data-op="del" aria-label="빼기">✕</button>
      </div>`;
    el.querySelector('.num').textContent = numberOf(i);
    el.querySelector('img').src = p.url;
    el.querySelector('.fname').textContent = p.name;
    for (const inp of el.querySelectorAll('input')) {
      const k = inp.dataset.k;
      inp.value = p[k];
      if (k === 'location') inp.placeholder = $('location').value;
      if (k === 'work') inp.placeholder = $('work').value;
      inp.addEventListener('change', () => { p[k] = inp.value; if (k === 'date') render(); });
    }
    el.querySelector('.ops').addEventListener('click', (e) => {
      const op = e.target.closest('button')?.dataset.op;
      if (!op) return;
      const idx = photos.indexOf(p);
      if (op === 'del') { URL.revokeObjectURL(p.url); photos.splice(idx, 1); }
      if (op === 'up' && idx > 0) [photos[idx - 1], photos[idx]] = [photos[idx], photos[idx - 1]];
      if (op === 'down' && idx < photos.length - 1) [photos[idx + 1], photos[idx]] = [photos[idx], photos[idx + 1]];
      render();
    });
    list.append(el);
  });
  $('make').disabled = photos.length === 0;
  setStatus(photos.length ? `사진 ${photos.length}장 · 엑셀 ${Math.ceil(photos.length / 2)}페이지` : '사진을 넣어 주세요.');
}

function setStatus(msg, warn = false) {
  $('status').textContent = msg;
  $('status').classList.toggle('warn', warn);
}

// ---- 사진 축소 (원본 그대로 넣으면 파일이 GB 단위로 커짐) ----
const MAX_SIDE = 1400;
async function shrink(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(bmp, 0, 0, w, h);
  bmp.close();
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
  return { buffer: await blob.arrayBuffer(), w, h };
}

// ---- 엑셀 레이아웃 (A4 세로, 한 페이지에 사진 2장) ----
const COLS = [14, 34, 12, 30];                     // 위치 | 값 | 일자 | 값
const colPx = (w) => Math.trunc(w * 7 + 5);
const H = { title: 24, num: 20, photo: 290, info: 24 }; // pt
const PT_PX = 4 / 3, EMU_PX = 9525;
const PHOTO_MAX = { w: 520, h: 360 };              // px, 사진 칸 안에서 비율 유지

function anchorAt(xPx, row0, yPx) {
  let col = 0;
  while (col < COLS.length - 1 && xPx >= colPx(COLS[col])) { xPx -= colPx(COLS[col]); col++; }
  return { nativeCol: col, nativeColOff: Math.round(xPx * EMU_PX), nativeRow: row0, nativeRowOff: Math.round(yPx * EMU_PX) };
}

async function buildWorkbook() {
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('사진대지', {
    pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
      horizontalCentered: true,
      margins: { left: 0.5, right: 0.5, top: 0.5, bottom: 0.4, header: 0.2, footer: 0.2 } },
    views: [{ showGridLines: false }],
  });
  ws.columns = COLS.map((width) => ({ width }));

  const font = { name: '맑은 고딕', size: 10 };
  const thin = { style: 'thin', color: { argb: 'FF000000' } };
  const all = { top: thin, left: thin, bottom: thin, right: thin };
  const center = { vertical: 'middle', horizontal: 'center' };
  const totalW = COLS.reduce((s, w) => s + colPx(w), 0);
  const project = $('project').value.trim();
  const defLoc = $('location').value.trim(), defWork = $('work').value.trim();

  let r = 1;
  for (let i = 0; i < photos.length; i++) {
    const p = photos[i];
    setStatus(`사진 처리 중… ${i + 1} / ${photos.length}`);

    if (i % 2 === 0) { // 페이지 머리
      if (i > 0) ws.getRow(r - 1).addPageBreak();
      const t = ws.getRow(r);
      t.height = H.title;
      ws.mergeCells(r, 1, r, 4);
      t.getCell(1).value = `◆ 공사명 : ${project}`;
      t.getCell(1).font = { ...font, size: 11, bold: true };
      t.getCell(1).alignment = { vertical: 'bottom' };
      r++;
    }

    // 번호 줄
    const numRow = ws.getRow(r);
    numRow.height = H.num;
    numRow.getCell(4).value = numberOf(i);
    numRow.getCell(4).font = font;
    numRow.getCell(4).alignment = { vertical: 'middle', horizontal: 'right', indent: 2 };
    for (let c = 1; c <= 4; c++) numRow.getCell(c).border = { top: thin, left: c === 1 ? thin : undefined, right: c === 4 ? thin : undefined };
    r++;

    // 사진 칸
    const photoRow = ws.getRow(r);
    photoRow.height = H.photo;
    for (let c = 1; c <= 4; c++) photoRow.getCell(c).border = { left: c === 1 ? thin : undefined, right: c === 4 ? thin : undefined };
    const img = await shrink(p.file);
    const s = Math.min(PHOTO_MAX.w / img.w, PHOTO_MAX.h / img.h);
    const w = Math.round(img.w * s), h = Math.round(img.h * s);
    const id = wb.addImage({ buffer: img.buffer, extension: 'jpeg' });
    // 왼쪽 위·오른쪽 아래 모서리를 모두 사진 칸에 고정한다. 크기(px)로만 지정하면
    // 엑셀 앱·뷰어마다 칸 크기 계산이 달라 사진이 아래 위치/일자 줄을 덮는 경우가 있다.
    const x0 = (totalW - w) / 2, y0 = (H.photo * PT_PX - h) / 2;
    ws.addImage(id, {
      tl: anchorAt(x0, r - 1, y0),
      br: anchorAt(x0 + w, r - 1, y0 + h),
      editAs: 'twoCell',
    });
    r++;

    // 위치 / 일자
    const info = ws.getRow(r);
    info.height = H.info;
    info.values = ['위    치', p.location || defLoc, '일    자', p.date];
    info.eachCell((cell) => { cell.font = font; cell.alignment = center; cell.border = all; });
    r++;

    // 작업내용
    const work = ws.getRow(r);
    work.height = H.info;
    ws.mergeCells(r, 2, r, 4);
    work.getCell(1).value = '작 업 내 용';
    work.getCell(2).value = p.work || defWork;
    for (let c = 1; c <= 4; c++) { const cell = work.getCell(c); cell.font = font; cell.alignment = center; cell.border = all; }
    r++;
  }
  return wb;
}

async function make() {
  $('make').disabled = true;
  try {
    const wb = await buildWorkbook();
    setStatus('엑셀 저장 중…');
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const filename = `사진대지_${numberOf(0)}~${numberOf(photos.length - 1)}.xlsx`;
    const size = `${(blob.size / 1048576).toFixed(1)}MB`;
    const downloads = window.claude?.use ? await window.claude.use('downloads') : null;
    if (downloads) {
      setStatus('저장 확인창에서 저장을 눌러 주세요.');
      try {
        await downloads.save({ filename, data: blob });
        setStatus(`완료: ${filename} (${size})`);
      } catch (e) {
        if (e?.code === 'declined') setStatus('저장을 취소했습니다. 다시 받으려면 엑셀 만들기를 누르세요.');
        else if (e?.code === 'rate_limited') setStatus('이미 저장 확인창이 열려 있습니다. 잠시 후 다시 눌러 주세요.', true);
        else setStatus(`이 화면에서는 저장할 수 없습니다 (${e?.code || e}).`, true);
      }
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      setStatus(`완료: ${filename} (${size})`);
    }
  } catch (e) {
    console.error(e);
    setStatus(`만들지 못했습니다: ${e.message}. 해당 사진을 빼고 다시 시도해 주세요.`, true);
  } finally {
    $('make').disabled = photos.length === 0;
  }
}

// ---- 입력 연결 ----
if (matchMedia('(pointer: coarse)').matches) document.documentElement.classList.add('touch');
$('pickFiles').onclick = () => $('fileInput').click();
$('pickDir').onclick = () => $('dirInput').click();
$('fileInput').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
$('dirInput').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
$('clear').onclick = () => { photos.forEach((p) => URL.revokeObjectURL(p.url)); photos = []; render(); };
$('make').onclick = make;
// 입력한 기본정보는 이 기기에 기억해 둔다
const SAVED = ['project', 'location', 'work', 'prefix', 'start'];
for (const id of SAVED) {
  try { const v = localStorage.getItem('ledger.' + id); if (v !== null) $(id).value = v; } catch (e) { /* 저장소 사용 불가 */ }
  $(id).addEventListener('input', () => {
    try { localStorage.setItem('ledger.' + id, $(id).value); } catch (e) { /* 저장소 사용 불가 */ }
    if (id !== 'project') render();
  });
}

async function filesFromEntry(entry) {
  if (entry.isFile) return [await new Promise((res, rej) => entry.file(res, rej))];
  const reader = entry.createReader(), out = [];
  for (;;) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    if (!batch.length) break;
    for (const e of batch) out.push(...await filesFromEntry(e));
  }
  return out;
}
const drop = $('drop');
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', async (e) => {
  e.preventDefault(); drop.classList.remove('over');
  const entries = [...e.dataTransfer.items].map((it) => it.webkitGetAsEntry?.()).filter(Boolean);
  if (entries.length) { const files = []; for (const en of entries) files.push(...await filesFromEntry(en)); addFiles(files); }
  else addFiles(e.dataTransfer.files);
});
</script>
